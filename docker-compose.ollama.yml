name: talkflow-local-stack
# Local Ollama serving Gemma 3 1B for the cleanup stage, so that stage can run
# offline without the Ollama Cloud dependency - see CLAUDE.md's "pipeline
# stages are independently configurable"; swap base_url/model_id in the Model
# Registry tab to use anything else.
#
# ASR (Nemotron 3.5 streaming) is NOT a container - it runs in-process via
# sherpa-onnx (talkflow/asr/nemotron_sherpa_adapter.py). This file used to
# also define a "nemotron-asr" service using NVIDIA's own
# nvcr.io/nvidia/nemo-speech.cpp:0.1.0 image, but that image doesn't work on
# this hardware: GPU mode SIGSEGVs (missing Turing/compute-7.5 CUDA kernel for
# an op used during warmup) and CPU mode loads and runs without crashing but
# silently returns an empty transcript for every real speech sample tested -
# see CLAUDE.md for the investigation. The model itself is fine; sherpa-onnx's
# int8 ONNX export of the same checkpoint transcribes correctly.
services:
  ollama-local:
    image: ollama/ollama:latest
    container_name: talkflow-ollama-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-local-data:/root/.ollama
    gpus: all
    # First run: docker exec talkflow-ollama-local ollama pull gemma3:1b
    # (806MB, Q4_K_M by default - see CLAUDE.md). No API key needed; the
    # Model Registry's cleanup stage just points base_url at
    # http://localhost:11434 with model_id "gemma3:1b".

volumes:
  ollama-local-data:
