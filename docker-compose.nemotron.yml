name: talkflow-local-stack
# Replaces docker-compose.asr.yml's Whisper/speaches container: Nemotron 3.5
# streaming ASR (Q8 GGUF, true cache-aware low-latency streaming over gRPC,
# not batch-per-pause) + a local Ollama serving Gemma 3 1B for the cleanup
# stage, so the whole pipeline can run offline without the Ollama Cloud
# dependency. Both are default/first-implemented choices per CLAUDE.md's
# "pipeline stages are independently configurable" - swap base_url/model_id
# in the Model Registry tab to use anything else.
#
# Nemotron runs on CPU, not GPU: this image's prebuilt GPU kernels are
# missing a compute-capability-7.5 (Turing/GTX 1650) variant of the PAD op
# used during ASR warmup - every GPU attempt SIGSEGVs during model load
# (confirmed: container restart-looped 5x within a minute on --gpu=0).
# CPU mode loads cleanly and, fed at the real-time pace the orchestrator
# actually uses (not a burst), keeps up with ~0.3s tail latency after speech
# ends - verified with scripts/smoke_test_nemotron.py. This is also a net
# win for the 4GB VRAM budget: it leaves the whole GPU free for Gemma.
# Switch "--gpu=-1" to "--gpu=0" to retry GPU once NVIDIA ships a Turing-
# compatible build of this image.
services:
  nemotron-asr:
    image: nvcr.io/nvidia/nemo-speech.cpp:0.1.0
    container_name: talkflow-nemotron-asr
    restart: unless-stopped
    ports:
      - "127.0.0.1:50051:50051"
    volumes:
      - ./models:/models:ro
    gpus: all
    command:
      - "--asr.model.path=/models/nemotron-3.5-asr-streaming-0.6b.q8_0.gguf"
      - "--gpu=-1"
      - "--bind=0.0.0.0:50051"
      # Lowest-latency context preset (~160ms) - streaming responsiveness is
      # the entire point of this switch; raise toward 1120ms only if accuracy
      # at 160ms proves too poor in practice.
      - "--chunk-sec=0.16"
      - "--asr.endpointing.enable=true"

  ollama-local:
    image: ollama/ollama:latest
    container_name: talkflow-ollama-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-local-data:/root/.ollama
    gpus: all
    # First run: docker exec talkflow-ollama-local ollama pull gemma3:1b
    # (806MB, Q4_K_M by default - see CLAUDE.md). No API key needed; the
    # Model Registry's cleanup stage just points base_url at
    # http://localhost:11434 with model_id "gemma3:1b".

volumes:
  ollama-local-data:
